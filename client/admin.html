

<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Stop - Admin Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .admin-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.75rem;
        }

        .admin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: .2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .admin-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .admin-btn-primary {
            background: #4f46e5;
            color: white;
        }

        .admin-btn-primary:hover {
            background: #4338ca;
        }

        .admin-btn-secondary {
            background: #374151;
            color: #d1d5db;
        }

        .admin-btn-secondary:hover {
            background: #4b5563;
        }

        .admin-btn-success {
            background: #16a34a;
            color: white;
        }

        .admin-btn-success:hover {
            background: #15803d;
        }

        .admin-btn-danger {
            background: #dc2626;
            color: white;
        }

        .admin-btn-danger:hover {
            background: #b91c1c;
        }

        .admin-form-input,
        .admin-form-select {
            width: 100%;
            background: #374151;
            border: 1px solid #4b5563;
            color: white;
            border-radius: .5rem;
            padding: .6rem .8rem;
        }

        .price-input {
            background: #1f2937 !important;
            border-color: #1f2937 !important;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200">

    <div id="admin-dashboard" class="p-6 max-w-8xl mx-auto">

        <header class="flex flex-wrap gap-4 justify-between items-center mb-8">

    <h1 class="text-3xl font-bold text-white">
        Admin Dashboard
    </h1>

    <div class="flex gap-2">

        
        <button id="logout-btn"
            class="admin-btn admin-btn-danger">
            Logout
        </button>

    </div>

</header>


        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- LEFT SIDE -->

            <div class="lg:col-span-1">

                <div class="admin-card p-6">

                    <h2 class="text-2xl font-semibold mb-4 text-indigo-400">
                        Create Walk-in Session
                    </h2>

                    <form id="walk-in-form" class="space-y-4">

                        <input
                            type="text"
                            id="walk-in-name"
                            class="admin-form-input"
                            placeholder="Customer Name"
                            required
                        >

                        <select
                            id="walk-in-game"
                            class="admin-form-select"
                            required
                        ></select>

                        <div id="walk-in-players-wrapper" class="hidden">

                            <select
                                id="walk-in-players"
                                class="admin-form-select"
                            ></select>

                        </div>

                        <div id="walk-in-duration-wrapper" class="hidden">

                            <select
                                id="walk-in-duration"
                                class="admin-form-select"
                                required
                            ></select>

                        </div>

                        <input
                            type="number"
                            id="walk-in-price"
                            class="admin-form-input price-input"
                            value="0"
                            readonly
                        >

                        <select
                            id="walk-in-payment"
                            class="admin-form-select"
                            required
                        >
                            <option value="QR Payment">QR Payment</option>
                            <option value="Cash">Cash</option>
                        </select>

                        <button
                            type="submit"
                            class="admin-btn admin-btn-primary w-full"
                        >
                            Start Session
                        </button>

                    </form>

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="lg:col-span-2 space-y-8">

                <div class="admin-card p-6">

                    <h2 class="text-2xl font-semibold text-green-400 mb-4">
                        Pending Bookings
                    </h2>

                    <div
                        id="pending-bookings-list"
                        class="space-y-4 max-h-96 overflow-y-auto"
                    ></div>

                </div>

                <div class="admin-card p-6">

                    <h2 class="text-2xl font-semibold text-blue-400 mb-4">
                        Approved Bookings
                    </h2>

                    <div
                        id="approved-bookings-list"
                        class="space-y-4 max-h-96 overflow-y-auto"
                    ></div>

                </div>

                <div class="admin-card p-6">

                    <h2 class="text-2xl font-semibold text-indigo-400 mb-4">
                        Active Game Sessions
                    </h2>

                    <div
                        id="active-sessions-list"
                        class="space-y-4 max-h-96 overflow-y-auto"
                    ></div>

                </div>

                <div class="admin-card p-6">

    <h2 class="text-2xl font-semibold text-yellow-400 mb-4">

        Session History

    </h2>

    <div id="history-list"
         class="overflow-x-auto">

    </div>

</div>

            </div>

        </main>

    </div>

    <script type="module" src="./js/adminApp.js"></script>

</body>

</html>
